services:
  app:
    build:
      context: .
    container_name: pos-dermoclinic
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - default
      - mysql-global

  nginx:
    image: nginx:1.29-alpine
    container_name: pos-dermoclinic-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - storage:/var/www/html/storage:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  vite:
    image: node:22-alpine
    container_name: pos-dermoclinic-vite
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
        exec npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

networks:
  mysql-global:
    external: true
    name: mysql-global

volumes:
  bootstrap-cache:
  node-modules:
  storage:
  vendor:
