services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-hospitalario-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    networks:
      - app
      - mysql-global

  nginx:
    image: nginx:1.29-alpine
    container_name: sistema-hospitalario-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app

  vite:
    image: node:22-alpine
    container_name: sistema-hospitalario-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - app

networks:
  app:
    driver: bridge
  mysql-global:
    external: true
    name: mysql-global

volumes:
  laravel_vendor:
  node_modules:
